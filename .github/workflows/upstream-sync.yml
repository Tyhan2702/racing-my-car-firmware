# Hourly: follow steveEcode/obd_brz_gauge. When its main branch has new commits, mirror them to this repository's
# main, merge them into image-frames (Racing My Car firmware: upstream + value-driven image frames), build with
# ESP-IDF v5.5.3 and publish the images as a pre-release. A merge conflict opens an issue instead of guessing.
# Nothing is sent to gauges: owners flash a release themselves (app → 设备更新).
name: Upstream firmware sync

on:
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:

concurrency: upstream-sync

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: image-frames
          fetch-depth: 0

      - name: Check upstream
        id: up
        run: |
          git remote add upstream https://github.com/steveEcode/obd_brz_gauge.git
          git fetch --quiet upstream main
          git fetch --quiet origin main
          UP=$(git rev-parse upstream/main); MINE=$(git rev-parse origin/main)
          echo "upstream=$UP" >> "$GITHUB_OUTPUT"
          if [ "$UP" = "$MINE" ]; then echo "Up to date with steveEcode/obd_brz_gauge@${UP:0:7}"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "New upstream commits:"; git log --oneline "$MINE..$UP" | head -50
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Mirror upstream main
        if: steps.up.outputs.changed == 'true'
        run: git push origin "${{ steps.up.outputs.upstream }}:refs/heads/main" --force

      - name: Merge into image-frames
        id: merge
        if: steps.up.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BEFORE=$(git rev-parse HEAD)
          if ! git merge --no-edit upstream/main; then
            FILES=$(git diff --name-only --diff-filter=U | sed 's/^/- /'); git merge --abort
            gh issue create --title "Upstream firmware update needs a manual merge (${{ steps.up.outputs.upstream }})" \
              --body "steveEcode/obd_brz_gauge main moved to ${{ steps.up.outputs.upstream }}, but merging it into image-frames conflicts in:"$'\n'"$FILES"$'\n\n'"main has been updated; image-frames is unchanged until the conflict is resolved."
            echo "Conflict: issue opened"; exit 1
          fi
          if [ "$(git rev-parse HEAD)" = "$BEFORE" ]; then echo "image-frames already contains it"; echo "built=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git push origin HEAD:image-frames; echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Build firmware
        if: steps.merge.outputs.built == 'true'
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          command: rm -rf build && idf.py build

      - name: Publish pre-release
        if: steps.merge.outputs.built == 'true'
        run: |
          UP=${{ steps.up.outputs.upstream }}; TAG="image-frames-$(date -u +%Y%m%d)-${UP:0:7}"
          cd build && sudo chown -R "$(id -u)" . && cp bootloader/bootloader.bin partition_table/partition-table.bin .
          gh release create "$TAG" obd_brz_gauge.bin bootloader.bin partition-table.bin ota_data_initial.bin flash_args --target image-frames --prerelease \
            --title "Firmware $TAG (test build)" \
            --notes "Automatic build: steveEcode/obd_brz_gauge@${UP:0:7} + Racing My Car image frames. **Test build, not yet verified on a gauge.** Wi-Fi OTA: obd_brz_gauge.bin (app → 设备更新). USB: see flash_args."
